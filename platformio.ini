[env:esp32-s3-wroom-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Швидкість монітора порту та прошивки (можна підняти до 921600 для швидшого завантаження)
monitor_speed = 115200
upload_speed = 115200

; --- Конфігурація Flash та PSRAM для чіпа N16R8 ---
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.flash_mode = qio

; Схема розділів для 16MB Flash (виділяє максимум місця під код та файлову систему)
board_build.partitions = default_16MB.csv

build_flags =
    ; Активація апаратної пам'яті PSRAM
    -D BOARD_HAS_PSRAM
    
    ; Налаштування USB CDC (щоб Serial працював через вбудований Type-C роз'єм плати)
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    
    ; Вказуємо LVGL, що конфігурація буде підключатися спрощено
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE

; --- Залежності (Бібліотеки) ---
lib_deps =
    ; Графічна бібліотека LovyanGFX
    lovyan03/LovyanGFX @ ^1.1.16
    
    ; Бібліотека LVGL (фіксуємо версію 9.x, оскільки ваш код написаний саме під неї)
    lvgl/lvgl @ ^9.2.2
    
    ; Бібліотеки для роботи з датчиком DHT11
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14