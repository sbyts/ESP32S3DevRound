[env:esp32-s3-devkitc-1]
platform = espressif32 @ 6.7.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 115200

monitor_rts = 0
monitor_dtr = 0

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0
    
    ; --- ГЛОБАЛЬНІ НАЛАШТУВАННЯ LVGL 9 ---
    -D LV_CONF_SKIP=1
    -D LV_COLOR_FORMAT_DEFAULT=LV_COLOR_FORMAT_RGB565
    -D LV_DPI_DEF=130
    -D LV_FONT_MONTSERRAT_14=1
    -D LV_FONT_MONTSERRAT_18=1
    -D LV_FONT_MONTSERRAT_32=1

lib_deps =
    ; Завантажує найсвіжішу версію з рідним GC9B72 драйвером
    lovyan03/LovyanGFX
    lvgl/lvgl @ 9.2.2
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14