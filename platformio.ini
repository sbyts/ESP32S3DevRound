[env:esp32-s3-wroom-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 115200

; --- Конфігурація Flash та PSRAM для чіпа N16R8 ---
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv

build_flags =
    ; Активація апаратної пам'яті PSRAM
    -D BOARD_HAS_PSRAM
    
    ; Налаштування USB CDC (вивід Serial через Type-C)
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    
    ; Кажемо LVGL НЕ шукати файл lv_conf.h, а брати налаштування з прапорців збірки
    -D LV_CONF_SKIP=1
    
    ; --- ОБОВ'ЯЗКОВІ НАЛАШТУВАННЯ LVGL 9 ---
    -D LV_COLOR_DEPTH=16
    -D LV_DPI_DEF=130
    
    ; --- УКЛЮЧЕННЯ ПОТРІБНИХ ШРИФТІВ ДЛЯ ВАШОГО UI ---
    -D LV_FONT_MONTSERRAT_14=1
    -D LV_FONT_MONTSERRAT_18=1
    -D LV_FONT_MONTSERRAT_32=1

; --- Залежності (Бібліотеки) ---
lib_deps =
    ; Ваша попередня версія Adafruit GFX та її шина
    adafruit/Adafruit GFX Library @ 1.11.9
    adafruit/Adafruit BusIO @ ^1.16.1
    
    ; Драйвер дисплея та графічне ядро
    lovyan03/LovyanGFX @ ^1.1.16
    lvgl/lvgl @ ^9.2.2
    
    ; Датчик температури
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14